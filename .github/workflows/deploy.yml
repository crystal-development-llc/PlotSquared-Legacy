name: "Deploy"

on:
  push:
    branches: [ '1.8.8-patched' ]
  workflow_dispatch: # manually triggered
    inputs:
      release:
        description: 'Is this a release build?'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    if: github.repository_owner == 'crystal-development-llc'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Checkout"
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up JDK"
        # https://github.com/actions/setup-java/releases
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: "Set up Gradle"
        # https://github.com/gradle/actions/releases
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          validate-wrappers: true
          gradle-version: wrapper
          cache-disabled: false

      - name: "Build"
        run: >-
            ./gradlew clean build
            ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && '-Prelease=true' || '' }}
            --no-configuration-cache
            --full-stacktrace

      - name: "Publish"
        run: >-
            ./gradlew publishAllPublicationsToAlpineCloudRepository    
            ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && '-Prelease=true' || '' }}
            --no-configuration-cache
            --full-stacktrace
        env:
          ALPINE_MAVEN_NAME: ${{ secrets.ALPINE_MAVEN_NAME }}
          ALPINE_MAVEN_SECRET: ${{ secrets.ALPINE_MAVEN_SECRET }}
