[versions]
# Runtime
spigot = "1.8.8-R0.1-SNAPSHOT"
gson = "2.2.4"
guava = "17.0"
snakeyaml = "1.26"

# Plugins
papi = "2.11.6"
vault = "1.7"
worldedit = "6.1.3-SNAPSHOT"

# Third-party
annotations = "26.0.2"
junit-jupiter = "5.13.3"
junit-platform-launcher = "1.13.3"

# Gradle
publish = "0.34.0"     # https://github.com/vanniktech/gradle-maven-publish-plugin/releases
shadow = "9.2.2"       # https://github.com/GradleUp/shadow/releases

[libraries]
# Runtime
spigotApi = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

# Plugins
papi = { group = "me.clip", name = "placeholderapi", version.ref = "papi" }
vault = { group = "com.github.MilkBowl", name = "VaultAPI", version.ref = "vault" }
worldeditBukkit = { group = "com.sk89q.worldedit", name = "worldedit-bukkit", version.ref = "worldedit" }
worldeditCore = { group = "com.sk89q.worldedit", name = "worldedit-core", version.ref = "worldedit" }

# Third-party
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
junitJupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junitPlatformLauncher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform-launcher" }

# Gradle
publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "publish" }
shadow-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
