[versions]
# Runtime
spigot-api = "1.8.8-R0.1-SNAPSHOT"
gson = "2.2.4"
guava = "17.0"
snakeyaml = "1.26"

# Plugins
papi = "2.11.6"
vault = "1.7"
worldedit = "6.1.3-SNAPSHOT"

# Third-party
annotations = "26.0.2"
junit-jupiter = "5.13.3"
junit-platform-launcher = "1.13.3"

# Gradle
grgit = "4.1.1"
publish = "0.34.0"
shadow = "9.0.0-rc2"

[libraries]
# Runtime
spigot-api = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot-api" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

# Plugins
papi = { group = "me.clip", name = "placeholderapi", version.ref = "papi" }
vault-api = { group = "com.github.MilkBowl", name = "VaultAPI", version.ref = "vault" }
worldedit-bukkit = { group = "com.sk89q.worldedit", name = "worldedit-bukkit", version.ref = "worldedit" }
worldedit-core = { group = "com.sk89q.worldedit", name = "worldedit-core", version.ref = "worldedit" }

# Third-party
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform-launcher" }

[plugins]
grgit = { id = "org.ajoberstar.grgit", version.ref = "grgit" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
